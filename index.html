<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yami y Yumi - Mercadito de Asia</title>
    <style>
        :root {
            --rosa-yumi: #FFC1CC;
            --azul-yami: #BDE0FE;
            --amarillo-star: #FFEA88;
            --marron-trazo: #5D4037;
            --crema-fondo: #FFFBF2;
        }

        body {
            background-color: var(--crema-fondo);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--marron-trazo);
        }

        .header { margin-top: 20px; text-align: center; }
        .logo { width: 150px; }
        
        .personajes-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .nenes { width: 120px; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        .form-container {
            background: white;
            padding: 20px;
            border-radius: 30px;
            border: 4px solid var(--azul-yami);
            width: 85%;
            max-width: 400px;
            text-align: center;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 20px;
            border: 2px solid var(--rosa-yumi);
            outline: none;
        }

        .btn {
            width: 90%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 50px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 5px 0px #d4a5af;
        }

        .btn:active { transform: translateY(4px); box-shadow: none; }

        .btn-codigo { background-color: var(--rosa-yumi); color: white; }
        .btn-invitado { background-color: var(--azul-yami); color: white; box-shadow: 0 5px 0px #8eb9db; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logotipo.jpg" alt="Mercadito de Asia" class="logo">
        <h2>¡Ayúdanos a encontrarnos!</h2>
    </div>

    <div class="personajes-container">
        <img src="2.jpg" alt="Yami" class="nenes">
        <img src="1.jpg" alt="Yumi" class="nenes">
    </div>

    <div id="step-mail" class="form-container">
        <p>¡Hola! Pide a un adulto su email para entrar al mundo de dulces:</p>
        <input type="email" id="user-email" placeholder="Email del adulto..." required>
        <button class="btn btn-codigo" onclick="saveEmail()">¡Entrar!</button>
    </div>

    <div id="step-options" class="form-container hidden">
        <button class="btn btn-codigo" onclick="showCodigo()">¡Tengo código de mi Box!</button>
        <button class="btn btn-invitado" onclick="goGuest()">No tengo código todavía</button>
    </div>

    <div id="step-verify" class="form-container hidden">
        <p>Escribe tu código mágico:</p>
        <input type="text" id="cupón" placeholder="Ej: ASIA123">
        <input type="text" id="user-ig" placeholder="Tu Instagram (opcional)">
        <button class="btn btn-codigo" onclick="verifyCode()">Buscar a mi hermano</button>
    </div>

    <script>
        let userData = { email: '' };

        function saveEmail() {
            const email = document.getElementById('user-email').value;
            if(email.includes('@')) {
                userData.email = email;
                // Aquí conectarías con la API de Google Sheets
                document.getElementById('step-mail').classList.add('hidden');
                document.getElementById('step-options').classList.remove('hidden');
            } else {
                alert("Por favor, pon un email válido 🍬");
            }
        }

        function showCodigo() {
            document.getElementById('step-options').classList.add('hidden');
            document.getElementById('step-verify').classList.remove('hidden');
        }

        function verifyCode() {
            const code = document.getElementById('cupón').value;
            const ig = document.getElementById('user-ig').value;
            
            // Lógica de validación simulada (esto debe ir a tu base de datos)
            if(code.length > 3) {
                alert("¡Código recibido! Estamos buscando a tu hermano en Instagram: " + ig);
                window.location.href = "seccion-premium.html"; // Donde están los cuentos extra
            } else {
                alert("Ese código no parece correcto...");
            }
        }

        function goGuest() {
            alert("¡Bienvenido! Podrás ver algunos cuentos y juegos.");
            window.location.href = "seccion-gratis.html";
        }
    </script>
</body>
</html>
