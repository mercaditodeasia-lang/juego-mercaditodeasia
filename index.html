<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yami y Yumi - Mercadito de Asia</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa-yumi: #FFC1CC; --azul-yami: #BDE0FE; --amarillo-star: #FFEA88;
            --marron-trazo: #5D4037; --crema-fondo: #FFFBF2;
        }
        body {
            background-color: var(--crema-fondo); font-family: 'Fredoka', sans-serif;
            margin: 0; display: flex; flex-direction: column; align-items: center; color: var(--marron-trazo);
        }
        .header { margin-top: 20px; text-align: center; }
        .logo { width: 150px; border-radius: 15px; }
        .personajes-container { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .nenes { 
            width: 110px; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            animation: aparecerSaltando 0.8s ease-out, flotar 3s ease-in-out infinite;
        }
        @keyframes aparecerSaltando { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
        @keyframes flotar { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        .form-container {
            background: white; padding: 20px; border-radius: 30px; border: 4px solid var(--azul-yami);
            width: 85%; max-width: 400px; text-align: center;
        }
        input {
            width: 85%; padding: 12px; margin: 10px 0; border-radius: 20px;
            border: 2px solid var(--rosa-yumi); outline: none; font-family: 'Fredoka', sans-serif;
        }
        .btn {
            width: 95%; padding: 15px; margin: 10px 0; border-radius: 50px; border: none;
            font-weight: bold; font-size: 18px; cursor: pointer; color: white; font-family: 'Fredoka', sans-serif;
        }
        .btn-rosa { background-color: var(--rosa-yumi); box-shadow: 0 5px 0px #e0a3af; }
        .btn-azul { background-color: var(--azul-yami); box-shadow: 0 5px 0px #a2c8eb; }
        .btn-amarillo { background-color: var(--amarillo-star); color: var(--marron-trazo); box-shadow: 0 5px 0px #e0cf78; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .hidden { display: none; }
        .card-juego { background: #fdfdfd; border: 2px dashed var(--rosa-yumi); margin: 10px 0; padding: 15px; border-radius: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="Mercadito de Asia" class="logo">
        <h2 id="titulo-principal">¡Hola, estamos listos para la aventura!</h2>
    </div>

    <div class="personajes-container">
        <img src="2.jpg" alt="Yami" class="nenes">
        <img src="1.jpg" alt="Yumi" class="nenes">
    </div>

    <div id="step-mail" class="form-container">
        <form id="form-email">
            <p>Pide a un adulto su email para guardar tus premios:</p>
            <input type="email" name="email" id="user-email" placeholder="Email del adulto..." required>
            <button type="button" class="btn btn-rosa" onclick="saveEmail()">¡Comenzar!</button>
        </form>
    </div>

    <div id="step-options" class="form-container hidden">
        <p>¿Tienes el código mágico de tu caja?</p>
        <button class="btn btn-rosa" onclick="showFormCodigo()">¡Sí, lo tengo!</button>
        <button class="btn btn-azul" onclick="goGuest()">No, quiero jugar igual</button>
    </div>

    <div id="step-verify" class="form-container hidden">
        <p>Escribe el código de tu Box:</p>
        <input type="text" id="cupón" placeholder="Ej: DULCE123">
        <p>Tu Instagram para avisarte:</p>
        <input type="text" id="user-ig" placeholder="@tu_usuario">
        <button class="btn btn-rosa" onclick="verifyCode()">🔍 Buscar a mi hermano</button>
        <button class="btn btn-azul" onclick="backToOptions()" style="font-size: 12px; padding: 5px;">Volver</button>
    </div>

    <div id="step-games" class="form-container hidden">
        <h3 id="mensaje-bienvenida">¡Zona de Juegos!</h3>
        <div class="card-juego">
            <p>📖 <b>Cuento:</b> Yami y el Ramen Gigante</p>
            <button class="btn btn-amarillo" onclick="alert('¡Próximamente!')">Leer ahora</button>
        </div>
        <div id="zona-premium" class="card-juego hidden">
            <p>🌟 <b>Misión Especial:</b> Detective de Dulces</p>
            <button class="btn btn-rosa" onclick="alert('Busca el sticker dorado en tu box!')">Ver Misión</button>
        </div>
        <button class="btn btn-azul" onclick="location.reload()">Salir</button>
    </div>

    <script>
        let isPremium = false;
        // 🚨 AQUÍ PEGA TU LINK DE FORMSPREE 🚨
        const FORMSPREE_URL = "ESCRIBE_AQUI_TU_LINK_DE_FORMSPREE"; 

        async function saveEmail() {
            const email = document.getElementById('user-email').value;
            if(email.includes('@')) {
                // Esto manda el mail de verdad
                fetch(FORMSPREE_URL, {
                    method: 'POST',
                    body: JSON.stringify({ email: email, mensaje: "Se unió a la aventura" }),
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }
                });
                document.getElementById('step-mail').classList.add('hidden');
                document.getElementById('step-options').classList.remove('hidden');
            } else { alert("Escribe un email válido 🍬"); }
        }

        function showFormCodigo() {
            document.getElementById('step-options').classList.add('hidden');
            document.getElementById('step-verify').classList.remove('hidden');
        }

        function backToOptions() {
            document.getElementById('step-verify').classList.add('hidden');
            document.getElementById('step-options').classList.remove('hidden');
        }

        async function verifyCode() {
            const code = document.getElementById('cupón').value;
            const ig = document.getElementById('user-ig').value;
            if(code.length > 3) {
                isPremium = true;
                fetch(FORMSPREE_URL, {
                    method: 'POST',
                    body: JSON.stringify({ email: document.getElementById('user-email').value, codigo: code, instagram: ig }),
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }
                });
                alert("¡Código Genial!");
                showGames();
            } else { alert("Código no válido"); goGuest(); }
        }

        function goGuest() { isPremium = false; showGames(); }

        function showGames() {
            document.getElementById('step-options').classList.add('hidden');
            document.getElementById('step-verify').classList.add('hidden');
            document.getElementById('step-games').classList.remove('hidden');
            if(isPremium) {
                document.getElementById('zona-premium').classList.remove('hidden');
                document.getElementById('mensaje-bienvenida').innerText = "¡Bienvenido, Explorador!";
            } else { document.getElementById('mensaje-bienvenida').innerText = "¡Zona de Invitados!"; }
        }
    </script>
</body>
</html>
