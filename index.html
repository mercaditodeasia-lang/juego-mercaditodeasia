<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercadito de Asia - Misión Yami y Yumi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <style>
        :root {
            --rosa: #ff99aa;
            --naranja: #ff5e4d;
            --fondo: #fff5f6;
        }
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            background-color: var(--fondo);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background: white;
            width: 90%;
            max-width: 500px;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            border: 4px solid var(--rosa);
        }
        .header-img { width: 120px; margin-bottom: 10px; }
        .characters {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        .char { width: 45%; transition: transform 0.3s; }
        .char:hover { transform: scale(1.1) rotate(5deg); }
        
        h1 { color: var(--naranja); font-size: 1.5rem; }
        
        input {
            width: 80%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 15px;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
        }
        input:focus { border-color: var(--naranja); }

        .btn {
            background: var(--naranja);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 5px 0 #c44536;
            transition: all 0.2s;
        }
        .btn:active { transform: translateY(4px); box-shadow: none; }

        #area-mision { display: none; margin-top: 20px; padding: 20px; background: #fff0f3; border-radius: 20px; }
        
        .download-zone {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .item-download {
            background: white;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--naranja);
            font-size: 0.8rem;
            border: 1px dashed var(--naranja);
        }
    </style>
</head>
<body>

<div class="container animate__animated animate__fadeIn">
    <img src="https://mercaditodeasia-lang.github.io/logo.png" class="header-img" alt="Logo">
    
    <div class="characters">
        <img src="2.jpg" class="char animate__animated animate__bounceInLeft" alt="Yami">
        <img src="1.jpg" class="char animate__animated animate__bounceInRight" alt="Yumi">
    </div>

    <div id="pantalla-inicio">
        <h1>¡HOLA EXPLORADOR!</h1>
        <p>¿Tenés el código secreto de tu caja?</p>
        <input type="text" id="codigo" placeholder="Ej: A2580">
        <br>
        <button class="btn" onclick="desbloquearMision()">¡VER MI MISIÓN!</button>
    </div>

    <div id="area-mision" class="animate__animated animate__jackInTheBox">
        <h2>✨ ¡Misión Desbloqueada! ✨</h2>
        <p>Antes de empezar, dejanos tu mail para enviarte nuevos desafíos cada mes:</p>
        
        <form action="https://formspree.io/f/TU_ID_AQUÍ" method="POST"> <input type="email" name="email" placeholder="Mail de mamá o papá" required>
            <button type="submit" class="btn" style="background: var(--rosa); box-shadow: 0 5px 0 #e68090;">SUSCRIBIRME</button>
        </form>

        <hr style="margin: 20px 0; border: 1px solid #ddd;">

        <h3>🎁 Tus Regalos de Hoy:</h3>
        <div class="download-zone">
            <a href="dibujo-para-colorear.pdf" class="item-download" download>🖍️ Dibujo para Colorear</a>
            <a href="audio-historia.mp3" class="item-download">🎧 Escuchar Cuento</a>
            <a href="receta-ramen.pdf" class="item-download" download>🍜 Receta Divertida</a>
            <a href="#" class="item-download">🎮 Juego Online</a>
        </div>
    </div>
</div>

<script>
    function desbloquearMision() {
        const codigo = document.getElementById('codigo').value;
        if(codigo.length > 2) { // Aquí podrías poner una clave específica
            document.getElementById('pantalla-inicio').style.display = 'none';
            document.getElementById('area-mision').style.display = 'block';
        } else {
            alert("¡Ups! Ese código no parece correcto. Mirá bien tu caja.");
        }
    }
</script>

</body>
</html>
